
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marcos Felipe Müller Pagani | Portfólio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f19;
            color: #f5f7fa;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }

        /* NAVBAR */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid #202838;
            backdrop-filter: blur(10px);
        }

        nav {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .logo span {
            color: #6ea8fe;
        }

        .logo:hover {
            color: #6ea8fe;
            transform: translateY(-1px);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: #b9c2d0;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #6ea8fe;
        }

        /* HERO */

        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            padding: 80px 0;
        }

        .hero-content {
            max-width: 900px;
        }

        .hero small {
            color: #6ea8fe;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1.05;
            margin: 15px 0;
        }

        .hero h2 {
            color: #b9c2d0;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: normal;
            margin-bottom: 25px;
        }

        .hero p {
            color: #aab3c2;
            font-size: 1.1rem;
            max-width: 800px;
        }

        .hero-highlight {
            color: #dce3ed;
            margin-top: 18px;
            font-weight: 500;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 13px 22px;
            border-radius: 8px;
            border: 1px solid #344057;
            transition: 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: #6ea8fe;
            color: #08101f;
            border-color: #6ea8fe;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* SECTIONS */

        section {
            padding: 90px 0;
            border-top: 1px solid #202838;
        }

        .section-title {
            margin-bottom: 45px;
        }

        .section-title span {
            color: #6ea8fe;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title h2 {
            font-size: 2.2rem;
            margin-top: 8px;
        }

        .section-title p {
            color: #9da7b7;
            margin-top: 10px;
        }

        /* SOBRE */

        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .about p {
            color: #b9c2d0;
            margin-bottom: 15px;
        }

        .highlight {
            border-left: 3px solid #6ea8fe;
            padding-left: 20px;
            color: #dce3ed;
        }

        .leadership-box {
            margin-top: 25px;
            padding: 22px;
            background: #111827;
            border: 1px solid #202a3b;
            border-radius: 12px;
        }

        .leadership-box h3 {
            margin-bottom: 10px;
        }

        .leadership-box p {
            margin-bottom: 0;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: #111827;
            border: 1px solid #202a3b;
            border-radius: 12px;
            padding: 25px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #3e5d91;
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .card p {
            color: #9da7b7;
            font-size: 0.95rem;
        }

        /* SKILLS */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .skill-box {
            background: #111827;
            border: 1px solid #202a3b;
            padding: 25px;
            border-radius: 12px;
        }

        .skill-box h3 {
            margin-bottom: 18px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: #1a2333;
            color: #cbd5e1;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid #2a3850;
        }

        /* EXPERIENCE */

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .experience {
            background: #111827;
            border: 1px solid #202a3b;
            border-radius: 12px;
            padding: 30px;
        }

        .experience-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .experience h3 {
            font-size: 1.3rem;
        }

        .company {
            color: #6ea8fe;
            margin-top: 4px;
        }

        .date {
            color: #8d98aa;
            font-size: 0.9rem;
        }

        .experience ul {
            margin-top: 20px;
            padding-left: 20px;
            color: #b9c2d0;
        }

        .experience li {
            margin-bottom: 8px;
        }

        /* LEADERSHIP */

        .leadership-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .leadership-card {
            background: #111827;
            border: 1px solid #202a3b;
            border-radius: 12px;
            padding: 25px;
            transition: 0.3s;
        }

        .leadership-card:hover {
            transform: translateY(-5px);
            border-color: #3e5d91;
        }

        .leadership-card .number {
            color: #6ea8fe;
            font-size: 0.85rem;
            font-weight: bold;
        }
